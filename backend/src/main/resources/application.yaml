spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/e_commerce?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: your_password
    hikari:
      maximum-pool-size: 10
  elasticsearch:
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
  validation:
    enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Spring AI 通义千问配置（通过 OpenAI 兼容接口）
  ai:
    openai:
      api-key: sk-your-api
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v2
    # 配置 VectorStore 使用 Simple 类型
    vectorstore:
      type: simple

server:
  port: 8080
